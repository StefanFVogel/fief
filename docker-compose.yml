services:
  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: fief
      POSTGRES_DB: fief
      POSTGRES_PASSWORD: fiefpassword
    volumes:
      - postgres-data:/var/lib/postgresql/data/
    ports:
      - "127.0.0.1:5432:5432"
  redis:
    image: redis:alpine
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  postgres-data:
